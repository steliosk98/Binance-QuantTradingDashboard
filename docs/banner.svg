      <stop offset="0%" stop-color="#f59e0b" stop-opacity="0.10"/>
      <stop offset="55%" stop-color="#07090d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="tape" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#2dd4bf"/>
      <stop offset="50%" stop-color="#f59e0b"/>
      <stop offset="100%" stop-color="#ef5350"/>
    </linearGradient>
  </defs>

  <rect width="1200" height="260" fill="#07090d"/>
