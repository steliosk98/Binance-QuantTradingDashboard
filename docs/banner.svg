    <text x="980" y="212" fill="#94a3b8">REGIME <tspan fill="#2dd4bf">TRENDING</tspan></text>
  </g>
  <rect x="221" y="226" width="760" height="2" fill="url(#tape)" opacity="0.65"/>

  <!-- status -->
