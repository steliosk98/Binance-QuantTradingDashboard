  <rect x="0.5" y="0.5" width="1199" height="259" stroke="#243044" stroke-width="1"/>

  <!-- corner ticks -->
  <path d="M14 26 V14 H26" stroke="#f59e0b" stroke-width="2"/>
  <path d="M1186 26 V14 H1174" stroke="#f59e0b" stroke-width="2"/>
  <path d="M14 234 V246 H26" stroke="#f59e0b" stroke-width="2"/>
  <path d="M1186 234 V246 H1174" stroke="#f59e0b" stroke-width="2"/>

  <!-- candlestick mark -->
  <g transform="translate(72,72)">
    <line x1="14" y1="0" x2="14" y2="116" stroke="#2dd4bf" stroke-width="3"/>
    <rect x="4" y="26" width="20" height="44" rx="2" fill="#2dd4bf"/>
    <line x1="52" y1="14" x2="52" y2="102" stroke="#ef5350" stroke-width="3"/>
    <rect x="42" y="36" width="20" height="36" rx="2" fill="#ef5350"/>
