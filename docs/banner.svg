    <tspan fill="#e8edf4">CRYPTO</tspan><tspan fill="#f59e0b">QUANT</tspan>
  </text>
  <text x="224" y="166" font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="17" letter-spacing="9" fill="#64748b">TERMINAL · QUANT RESEARCH PLATFORM</text>

  <!-- fake tape -->
  <g font-family="'JetBrains Mono',ui-monospace,Menlo,monospace" font-size="13">
    <text x="222" y="212" fill="#94a3b8">BTC <tspan fill="#2dd4bf">▲ 63,191.66</tspan></text>
    <text x="420" y="212" fill="#94a3b8">ETH <tspan fill="#2dd4bf">▲ 1,660.85</tspan></text>
    <text x="600" y="212" fill="#94a3b8">SOL <tspan fill="#ef5350">▼ 65.540</tspan></text>
