services:
  db:
    image: timescale/timescaledb:latest-pg16
    environment:
      POSTGRES_USER: cryptoquant
      POSTGRES_PASSWORD: cryptoquant
      POSTGRES_DB: cryptoquant
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U cryptoquant"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    environment:
      DATABASE_URL: postgresql+asyncpg://cryptoquant:cryptoquant@db:5432/cryptoquant
      REDIS_URL: redis://redis:6379/0
      CORS_ORIGINS: http://localhost:5173
      SECRET_KEY: dev-secret-key-change-in-production
      APP_PASSWORD_HASH: "$$argon2id$$v=19$$m=65536,t=3,p=4$$ToaJFFmbaV0qiQKJ25+Npw$$z05JW0kVbagfpVuS2tdC9C9RWVU1IeGNuQqxW4XeZSs"
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  worker:
    build: ./backend
    command: ["python", "-m", "app.ingestion.worker"]
    environment:
      DATABASE_URL: postgresql+asyncpg://cryptoquant:cryptoquant@db:5432/cryptoquant
      REDIS_URL: redis://redis:6379/0
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  paper:
    build: ./backend
    command: ["python", "-m", "app.paper.runner"]
    environment:
      DATABASE_URL: postgresql+asyncpg://cryptoquant:cryptoquant@db:5432/cryptoquant
      REDIS_URL: redis://redis:6379/0
      TRADING_MODE: testnet
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  frontend:
    build: ./frontend
    environment:
      VITE_API_URL: http://backend:8000
    ports:
      - "5173:5173"
    depends_on:
      - backend

volumes:
  pgdata:
